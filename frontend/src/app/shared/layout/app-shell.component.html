<div class="shell">
  <aside class="sidebar" aria-label="Navegação principal">
    <a class="brand" routerLink="/" aria-label="Veloce início"><img class="brand-logo" src="assets/veloce-logo.png" alt="Veloce"></a>
    <nav>
      <a class="nav-item" routerLink="/" routerLinkActive="nav-item--active" [routerLinkActiveOptions]="{ exact: true }"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect></svg><span>Visão geral</span></a>
      <a class="nav-item" routerLink="/clientes" routerLinkActive="nav-item--active"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="8" r="3"></circle><path d="M2.8 19a5.2 5.2 0 0 1 10.4 0"></path><path d="M15 11h5l2 3v5h-9v-5l2-3Z"></path><circle cx="16.5" cy="19" r="1.5"></circle><circle cx="20" cy="19" r="1.5"></circle></svg><span>Clientes e veículos</span></a>
    </nav>
    <div class="sidebar-bottom"><p class="sidebar-note">Ambiente local<br>Fundação do produto</p><button class="logout-button" type="button" (click)="logout()">Sair</button></div>
  </aside>
  <main class="main-content">
    <header class="page-heading">
      <div><p class="eyebrow">Operação / Início</p><h1>{{ title }}</h1><p class="description">{{ description }}</p></div>
      <div class="environment-chip" aria-label="Ambiente local"><span class="status-dot"></span><span>Local</span></div>
    </header>
    <ng-content></ng-content>
  </main>
</div>

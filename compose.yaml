services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-veloce}
      MYSQL_USER: ${MYSQL_USER:-veloce}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-veloce_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - veloce_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  veloce_mysql_data:
